<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LWCS Library Portal</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: white;
    padding: 30px;
    border-radius: 12px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

h1 {
    text-align: center;
    color: #1e293b;
    margin-top: 0;
}

p.subtitle {
    text-align: center;
    color: #64748b;
    margin-bottom: 25px;
}

label {
    font-size: 14px;
    font-weight: bold;
    color: #334155;
    display: block;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #4338ca;
}

.error {
    background: #fef2f2;
    color: #dc2626;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 15px;
    display: none;
    font-size: 14px;
}

.success-page {
    display: none;
    background: white;
    padding: 40px;
    border-radius: 12px;
    text-align: center;
    max-width: 500px;
}

.success-page h2 {
    color: #16a34a;
    font-size: 24px;
}

.info-note {
    font-size: 12px;
    color: #64748b;
    text-align: center;
    margin-top: 20px;
}

.hidden { display: none !important; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-box">
    <h1>📚 LWCS Library Portal</h1>
    <p class="subtitle">Sign in to access the system</p>
    
    <div id="errorBox" class="error"></div>
    
    <label>Email / Username</label>
    <input type="text" id="emailInput" placeholder="admin@lwcs.ph">
    
    <label>Password</label>
    <input type="password" id="passwordInput" placeholder="admin123">
    
    <button onclick="tryLogin()">Sign In</button>
    
    <p class="info-note">Default login:<br>
    Email: <strong>admin@lwcs.ph</strong><br>
    Password: <strong>admin123</strong></p>
</div>

<!-- MAIN APPLICATION -->
<div id="mainApp" class="success-page hidden">
    <h2>✅ Welcome to LWCS Library!</h2>
    <p>You are successfully logged in.</p>
    <p style="color:#64748b; font-size:14px;">Your full library catalog and features will load here.</p>
    <button onclick="logout()" style="background:#6b7280; margin-top:20px; max-width:200px;">Sign Out</button>
</div>

<script>
// Simple login verification
function tryLogin() {
    var email = document.getElementById('emailInput').value.trim();
    var password = document.getElementById('passwordInput').value.trim();
    var errorBox = document.getElementById('errorBox');
    
    if (email === 'admin@lwcs.ph' && password === 'admin123') {
        // Login successful — show main app
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
    } else {
        // Show error message
        errorBox.style.display = 'block';
        if (email !== 'admin@lwcs.ph') {
            errorBox.textContent = '❌ Email is incorrect. Use: admin@lwcs.ph';
        } else if (password !== 'admin123') {
            errorBox.textContent = '❌ Password is incorrect. Use: admin123';
        } else {
            errorBox.textContent = '❌ Email and password are both incorrect.';
        }
    }
}

function logout() {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
    document.getElementById('emailInput').value = '';
    document.getElementById('passwordInput').value = '';
    document.getElementById('errorBox').style.display = 'none';
}
</script>

</body>
</html>
